<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>DayTrader Error</title><link rel="stylesheet" href="style.css"></head>
<body bgcolor="#ffffff">
<table width="740">
  <tr><td bgcolor="#c93333" align="left" width="640" height="10"><b><font color="#ffffff">DayTrader Error</font></b></td>
    <td align="center" bgcolor="#000000" width="100" height="10"><font color="#ffffff"><b>DayTrader</b></font></td></tr>
</table>
<table width="740">
  <tr><td width="3"></td><td><hr></td><td width="3"></td></tr>
  <tr><td bgcolor="#e7e4e7" rowspan="4" width="3"></td><td><b><font color="#000000">An Error has occured during DayTrader processing</font><font size="-2">.</font></b><br>
    The stack trace detailing the error follows.
    <p><b>Please consult the application server error logs for further details.</b></p>
  </td><td bgcolor="#e7e4e7" width="3" rowspan="4"></td></tr>
  <tr><td><font size="-1"><br><br><b>Processing request:</b><span th:text="${requestUri}"></span>
    <br><b>StatusCode:</b> 500<br><b>Message:</b><span th:text="${exceptionMessage}"></span>
    <br><b>Exception:</b><pre th:text="${stackTrace}"></pre></font></td></tr>
  <tr><td align="left"></td></tr><tr><td><hr></td></tr>
</table>
<table><tr><td bgcolor="#c93333" align="left" width="640" height="10"><b><font color="#ffffff">DayTrader Error</font></b></td>
  <td align="center" bgcolor="#000000" width="100" height="10"><font color="#ffffff"><b>DayTrader</b></font></td></tr></table>
</body>
</html>
